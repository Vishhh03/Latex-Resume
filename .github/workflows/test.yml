name: Test & Validate Resume Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend & Typst Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'latest'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda_src/requirements.txt

      - name: Run Backend Unit Tests
        run: |
          python -m unittest lambda_src/test_handler.py

      - name: Test Typst PDF Compilation
        run: |
          typst compile --root . template.typ test_output.pdf
          test -f test_output.pdf && echo "✓ Typst PDF compilation successful!"

  test-frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Next.js Export
        working-directory: ./web
        run: npm run build
