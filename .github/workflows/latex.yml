name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '.github/workflows/latex.yml'

permissions:
  contents: write

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Prevent runaway jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:

          fetch-depth: 1

      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          compiler: latexmk
          args: -xelatex -interaction=nonstopmode -halt-on-error

      - name: Fix Permissions
        run: sudo chown -R $USER:$USER .

      - name: Organize PDFs & Generate Release Notes
        run: |
          mkdir -p /tmp/pdfs
          echo "Your compiled resume versions are ready for download!" > /tmp/release_body.txt
          echo -e "\n### Inline Previews:" >> /tmp/release_body.txt
          
          for f in *.tex; do
            pdf_name="${f%.tex}.pdf"
            if [ -f "$pdf_name" ]; then
              cp "$pdf_name" /tmp/pdfs/
              echo "- **${pdf_name%.pdf}**: [Preview PDF](https://github.com/${{ github.repository }}/blob/pdf-output/$pdf_name)" >> /tmp/release_body.txt
            fi
          done

      # Push PDFs to orphan branch for inline preview
      - name: Push PDFs to pdf-output branch
        run: |
          git checkout --orphan pdf-output-temp
          git rm -rf .
          cp /tmp/pdfs/*.pdf .
          git add *.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-compile resumes [skip ci]"
          git push origin pdf-output-temp:pdf-output --force

      # Also create release for download
      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Resume
          files: /tmp/pdfs/*.pdf
          body_path: /tmp/release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}