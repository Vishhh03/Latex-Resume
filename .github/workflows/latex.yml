name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '.github/workflows/latex.yml'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Force compilation of all .tex files'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Prevent runaway jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history so we can compute diffs between commits

      - name: Determine Files to Compile
        id: files-selector
        run: |
          # Use a multi-line output for GITHUB_OUTPUT
          echo "files<<EOF" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_all }}" = "true" ]; then
              echo "Force Compile All requested via workflow_dispatch."
              find . -maxdepth 1 -name "*.tex" -printf "%P\n" >> $GITHUB_OUTPUT
            else
              echo "Workflow dispatch triggered. Compiling all .tex files by default."
              find . -maxdepth 1 -name "*.tex" -printf "%P\n" >> $GITHUB_OUTPUT
            fi
          else
            # Push trigger. Check changed files.
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch/ref push. Checking HEAD~1 diff."
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '\.tex$' || true)
            else
              echo "Comparing diff between ${{ github.event.before }} and ${{ github.event.after }}."
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '\.tex$' || true)
            fi
            
            # Check if workflow file itself was modified
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              WORKFLOW_CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD | grep '.github/workflows/latex.yml$' || true)
            else
              WORKFLOW_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '.github/workflows/latex.yml$' || true)
            fi
            
            if [ -n "$WORKFLOW_CHANGED" ]; then
              echo "Workflow file was modified. Compiling all .tex files."
              find . -maxdepth 1 -name "*.tex" -printf "%P\n" >> $GITHUB_OUTPUT
            elif [ -n "$CHANGED_FILES" ]; then
              echo "Modified .tex files detected:"
              echo "$CHANGED_FILES"
              echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            else
              echo "No .tex files changed. Compiling all as fallback."
              find . -maxdepth 1 -name "*.tex" -printf "%P\n" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ steps.files-selector.outputs.files }}
          glob_root_file: false
          compiler: latexmk
          args: -xelatex -interaction=nonstopmode -halt-on-error

      - name: Fix Permissions
        run: sudo chown -R $USER:$USER .

      - name: Organize Compiled PDFs
        run: |
          mkdir -p /tmp/pdfs
          for f in *.tex; do
            pdf_name="${f%.tex}.pdf"
            if [ -f "$pdf_name" ]; then
              cp "$pdf_name" /tmp/pdfs/
            fi
          done

      # Push PDFs to orphan branch for inline preview
      - name: Combine and Push PDFs to pdf-output branch
        run: |
          mkdir -p /tmp/combined_pdfs
          
          # Fetch existing pdf-output branch to get unmodified PDFs
          git fetch origin pdf-output:pdf-output-existing --depth=1 || true
          
          # If it exists, extract its PDFs
          if git show-ref --verify --quiet refs/heads/pdf-output-existing; then
            echo "Found existing pdf-output branch. Extracting existing PDFs..."
            for file in $(git ls-tree -r --name-only pdf-output-existing | grep '\.pdf$' || true); do
              git show pdf-output-existing:"$file" > "/tmp/combined_pdfs/$file"
            done
          fi
          
          # Copy newly compiled PDFs (overwriting updated ones)
          cp /tmp/pdfs/*.pdf /tmp/combined_pdfs/ || true
          
          # Generate Release Body based on the complete combined set
          echo "Your compiled resume versions are ready for download!" > /tmp/release_body.txt
          echo -e "\n### Inline Previews:" >> /tmp/release_body.txt
          for pdf in /tmp/combined_pdfs/*.pdf; do
            pdf_name=$(basename "$pdf")
            echo "- **${pdf_name%.pdf}**: [Preview PDF](https://github.com/${{ github.repository }}/blob/pdf-output/$pdf_name)" >> /tmp/release_body.txt
          done
          
          # Switch to orphan branch
          git checkout --orphan pdf-output-temp
          git rm -rf .
          
          # Copy combined PDFs into the clean workspace
          cp /tmp/combined_pdfs/*.pdf .
          git add *.pdf
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-compile resumes [skip ci]"
          git push origin pdf-output-temp:pdf-output --force

      # Also update the latest release with the full set of PDFs
      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Resume
          files: /tmp/combined_pdfs/*.pdf
          body_path: /tmp/release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}