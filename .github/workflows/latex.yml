name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - '**.tex'
      - '.github/workflows/latex.yml'

permissions:
  contents: write

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Prevent runaway jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:

          fetch-depth: 1

      # Use robust TeXLive container to compile all LaTeX files
      - name: Build PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: "*.tex"
          glob_root_file: true
          compiler: latexmk
          args: -xelatex -interaction=nonstopmode

      - name: Fix Permissions
        run: sudo chown -R $USER:$USER .

      - name: Move PDFs to tmp
        run: |
          mkdir -p /tmp/pdfs
          # Only copy PDFs that have a corresponding .tex file (to avoid copying other PDFs)
          for f in *.tex; do
            if [ -f "${f%.tex}.pdf" ]; then
              cp "${f%.tex}.pdf" /tmp/pdfs/
            fi
          done

      - name: Generate Release Body
        run: |
          echo "Your compiled resume versions are ready for download below!" > /tmp/release_body.txt
          echo "" >> /tmp/release_body.txt
          echo "You can preview each version inline:" >> /tmp/release_body.txt
          for f in /tmp/pdfs/*.pdf; do
            name=$(basename "$f" .pdf)
            echo "- **$name**: [Preview PDF](https://github.com/${{ github.repository }}/blob/pdf-output/$name.pdf)" >> /tmp/release_body.txt
          done

      # Push PDFs to orphan branch for inline preview
      - name: Push PDFs to pdf-output branch
        run: |
          git checkout --orphan pdf-output-temp
          git rm -rf .
          cp /tmp/pdfs/*.pdf .
          git add *.pdf
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git commit -m "Update resume PDFs"
          git push origin pdf-output-temp:pdf-output --force

      # Also create release for download
      - name: Create Release with PDFs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Resume
          files: /tmp/pdfs/*.pdf
          body_path: /tmp/release_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}