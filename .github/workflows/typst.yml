name: Build Resume PDF (Typst)

on:
  push:
    branches: [ main ]
    paths:
      - 'resumes/**'
      - 'templates/**'
      - '.github/workflows/typst.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Typst Resume PDFs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v3
        with:
          typst-version: 'latest'

      - name: Compile All Resume PDFs with Typst
        run: |
          mkdir -p /tmp/pdf_out
          for f in resumes/*.json; do
            if [ -f "$f" ]; then
              base=$(basename "$f" .json)
              mkdir -p "/tmp/typst_build_$base"
              cp "$f" "/tmp/typst_build_$base/resume.json"
              cp templates/template.typ "/tmp/typst_build_$base/template.typ"
              typst compile --root "/tmp/typst_build_$base" "/tmp/typst_build_$base/template.typ" "resumes/$base.pdf"
              cp "resumes/$base.pdf" /tmp/pdf_out/
              echo "✓ Compiled resumes/$base.pdf"
            fi
          done

      - name: Push PDFs to pdf-output Branch
        run: |
          git checkout --orphan pdf-output-temp
          git rm -rf .
          
          cp /tmp/pdf_out/*.pdf . 2>/dev/null || true
          git add *.pdf
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-compile resume PDFs [skip ci]" || true
          git push origin pdf-output-temp:pdf-output --force

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Resume PDFs
          files: resumes/*.pdf
          body: "Automated Typst PDF build from main branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
